name: Release

on:
  push:
    branches:
      - master

concurrency: release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: version
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: true
          extra_plugins: conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.version.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login
        if: steps.version.outputs.new_release_published == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: steps.version.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: elnebuloso/amber:${{ steps.version.outputs.new_release_version }}

      - name: Tag and release
        if: steps.version.outputs.new_release_published == 'true'
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

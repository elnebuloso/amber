services:
  amber:
    image: amber:local
    build:
      context: .
    ports:
      - 127.0.0.1:8080:80
    volumes:
      - ./app:/app
    # No variables on purpose: this is the page a stranger gets from `docker run`
    # with nothing configured, which is the one nobody would otherwise look at.

  amber-markdown:
    image: amber:local
    build:
      context: .
    ports:
      - 127.0.0.1:8081:80
    volumes:
      # The image carries an empty /app/content, because docker creates a missing
      # mount point — and with ./app mounted over /app that lands in the source tree.
      - ./app:/app
      - ./demo:/app/content:ro
    environment:
      APP_NAME: amber

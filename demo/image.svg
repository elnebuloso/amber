<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img"
     aria-label="a striped field standing in for an operator's own image">
	<style>
		.light { fill: #8b8b93 }
		.dark { fill: #7c7c85 }
		@media (prefers-color-scheme: dark) {
			.light { fill: #3a3a42 }
			.dark { fill: #313139 }
		}
	</style>
	<defs>
		<pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse"
		         patternTransform="rotate(45)">
			<rect class="light" width="16" height="16"/>
			<rect class="dark" width="8" height="16"/>
		</pattern>
	</defs>
	<rect width="640" height="200" fill="url(#stripes)"/>
</svg>
